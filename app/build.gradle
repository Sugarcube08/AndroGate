plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.devtools.ksp'
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas".toString())
}

android {
    compileSdk 34

    defaultConfig {
        applicationId "com.connectme.androgate"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    lint {
        disable 'MissingTranslation', 'InlinedApi'
        abortOnError false
    }
    buildFeatures {
        viewBinding true
    }
    def localProperties = new Properties()
    def localPropertiesFile = rootProject.file('local.properties')
    if (localPropertiesFile.exists()) {
        localPropertiesFile.withReader('UTF-8') { reader ->
            localProperties.load(reader)
        }
    }
    def keystorePropertiesFile = file('keystore.properties')
    if (!keystorePropertiesFile.exists()) {
        keystorePropertiesFile = rootProject.file('keystore.properties')
    }
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystorePropertiesFile.withReader('UTF-8') { reader ->
            keystoreProperties.load(reader)
        }
    }

    def resolveSigningProp = { String... keys ->
        for (String key : keys) {
            String envVal = System.getenv(key)
            if (envVal != null && !envVal.isEmpty()) return envVal
            if (project.hasProperty(key)) return project.property(key) as String
            String propVal = keystoreProperties.getProperty(key) ?: localProperties.getProperty(key)
            if (propVal != null && !propVal.isEmpty()) return propVal
        }
        return null
    }

    def releaseStoreFile = {
        String customPath = resolveSigningProp("SIGNING_STORE_FILE", "signing.storeFile", "signingStoreFile", "storeFile")
        if (customPath != null) {
            def f = file(customPath)
            if (f.exists()) return f
            f = rootProject.file(customPath)
            if (f.exists()) return f
        }
        if (file("keystore.jks").exists()) return file("keystore.jks")
        if (rootProject.file("keystore.jks").exists()) return rootProject.file("keystore.jks")
        return null
    }()

    def releaseStorePassword = resolveSigningProp("SIGNING_STORE_PASSWORD", "signing.storePassword", "signingStorePassword", "storePassword")
    def releaseKeyAlias = resolveSigningProp("SIGNING_KEY_ALIAS", "signing.keyAlias", "signingKeyAlias", "keyAlias") ?: "my-key-alias"
    def releaseKeyPassword = resolveSigningProp("SIGNING_KEY_PASSWORD", "signing.keyPassword", "signingKeyPassword", "keyPassword") ?: releaseStorePassword

    signingConfigs {
        release {
            if (releaseStoreFile != null && releaseStoreFile.exists() && releaseStorePassword != null) {
                storeFile releaseStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }
    buildTypes {
        debug {
            debuggable true
            manifestPlaceholders = [networkSecurityConfig: "@xml/network_security_config"]
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseStoreFile != null && releaseStoreFile.exists() && releaseStorePassword != null) {
                signingConfig signingConfigs.release
            } else if (project.hasProperty("signReleaseWithDebug") || System.getenv("SIGN_RELEASE_WITH_DEBUG") == "true") {
                signingConfig signingConfigs.debug
            }
            manifestPlaceholders = [networkSecurityConfig: "@xml/network_security_config"]
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    packagingOptions {
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/io.netty.versions.properties'
    }
    namespace 'me.capcom.smsgateway'

    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }
}

dependencies {
    def ktor_version = "2.2.4"
    def okhttp_version = "4.10.0"
    def room_version = "2.4.3"
    def coroutines_version = "1.6.1"
    def work_version = "2.7.1"
    def koin_version = "3.4.0"
    def lifecycle_version = "2.6.2"

    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version")

    implementation("io.ktor:ktor-serialization-gson:$ktor_version")
    implementation("io.ktor:ktor-client-core:$ktor_version")
    implementation("io.ktor:ktor-client-content-negotiation:$ktor_version")
    implementation("io.ktor:ktor-client-okhttp:$ktor_version")

    implementation("com.squareup.okhttp3:okhttp:$okhttp_version")
    implementation("com.squareup.okhttp3:okhttp-sse:$okhttp_version")

    // AndroidX WorkManager
    implementation "androidx.work:work-runtime-ktx:$work_version"

    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"

    implementation("androidx.preference:preference-ktx:1.2.1")
    implementation("androidx.core:core-ktx:1.12.0")
    implementation("androidx.core:core-splashscreen:1.0.1")
    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("com.google.android.material:material:1.11.0")
    implementation("androidx.constraintlayout:constraintlayout:2.1.4")

    implementation("com.aventrix.jnanoid:jnanoid:2.0.0")

    implementation("androidx.room:room-ktx:$room_version")
    ksp("androidx.room:room-compiler:$room_version")

    implementation 'com.googlecode.libphonenumber:libphonenumber:9.0.22'

    // Koin for Android
    implementation "io.insert-koin:koin-android:$koin_version"

    testImplementation("junit:junit:4.13.2")
    testImplementation("androidx.arch.core:core-testing:2.1.0")
    testImplementation("org.jetbrains.kotlinx:kotlinx-coroutines-test:$coroutines_version")
    androidTestImplementation("androidx.test.ext:junit:1.1.3")
    androidTestImplementation("androidx.test.espresso:espresso-core:3.4.0")
}
