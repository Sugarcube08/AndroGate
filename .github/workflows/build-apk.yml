name: Build AndroGate APK

on:
  workflow_call:
    inputs:
      version-name:
        required: true
        type: string
    secrets:
      signing-key-store-base64:
        required: true
      signing-key-alias:
        required: true
      signing-key-password:
        required: true
      signing-store-password:
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure version
        shell: bash
        env:
          VERSION_NAME: ${{ inputs.version-name }}
        run: |
          set -euo pipefail
          version="${VERSION_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid version: $version"; exit 1; }
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"$version\"/" app/build.gradle

      - name: Run unit tests
        run: ./gradlew --no-daemon test

      - name: Decode release keystore
        shell: bash
        env:
          ENCODED_KEYSTORE: ${{ secrets.signing-key-store-base64 }}
        run: |
          set -euo pipefail
          test -n "$ENCODED_KEYSTORE"
          printf '%s' "$ENCODED_KEYSTORE" | base64 --decode > app/keystore.jks
          test -s app/keystore.jks

      - name: Build signed release APK and bundle
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.signing-key-alias }}
          SIGNING_KEY_PASSWORD: ${{ secrets.signing-key-password }}
          SIGNING_STORE_PASSWORD: ${{ secrets.signing-store-password }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify release signing
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$APK"
          apksigner verify --verbose "$APK"
          apksigner verify --print-certs "$APK"
          keytool -list -v -keystore app/keystore.jks -alias "$SIGNING_KEY_ALIAS" -storepass "$SIGNING_STORE_PASSWORD" -keypass "$SIGNING_KEY_PASSWORD" | grep -E 'SHA256:|SHA-256:'
          echo "APK_SHA256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AndroGate release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: androgate-${{ inputs.version-name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
